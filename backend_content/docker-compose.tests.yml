name: mimicron-test

services:
  postgres_test:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: mimicron_test
      POSTGRES_USER: mimicron_test
      POSTGRES_PASSWORD: mimicron_test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mimicron_test -d mimicron_test"]
      interval: 2s
      timeout: 5s
      retries: 15

  qdrant_test:
    image: qdrant/qdrant:v1.15.5
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 2s
      timeout: 5s
      retries: 15

  backend_test:
    build:
      context: .
      dockerfile: Dockerfile.tests-app
    depends_on:
      postgres_test:
        condition: service_healthy
      qdrant_test:
        condition: service_healthy
    env_file:
      - .env.tests
    command:
      [
        "sh",
        "-c",
        "alembic upgrade head && uvicorn tests.functional.confapp:app --host 0.0.0.0 --port 8000",
      ]
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 2s
      timeout: 5s
      retries: 15

  tests:
    build:
      context: .
      dockerfile: Dockerfile.tests
    depends_on:
      postgres_test:
        condition: service_healthy
      qdrant_test:
        condition: service_healthy
      backend_test:
        condition: service_healthy
    env_file:
      - .env.tests
    environment:
      TEST_BASE_URL: http://backend_test:8000
    command: ["pytest"]
