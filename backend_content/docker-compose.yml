services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: mimicron
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: mimicron
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d mimicron"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  qdrant:
    image: qdrant/qdrant:v1.15.5
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  backend:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    environment:
      POSTGRES_DB: mimicron
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: mimicron
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-GigaChat-2}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-gigachat}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-Embeddings}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-1024}
      EMBEDDING_TIMEOUT_SECONDS: ${EMBEDDING_TIMEOUT_SECONDS:-30}
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-memories}
      QDRANT_DISTANCE: ${QDRANT_DISTANCE:-Cosine}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-RS256}
      JWT_PUBLIC_KEY_PATH: /app/certs/jwt-public.pem
    volumes:
      - ./tests/docker/certs/jwt-public.pem:/app/certs/jwt-public.pem:ro
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    ports:
      - "8000:8000"

volumes:
  postgres_data:
  qdrant_data:
