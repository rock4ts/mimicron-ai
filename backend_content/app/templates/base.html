<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <meta name="htmx-config" content='{"selfRequestsOnly":true,"historyCacheSize":0}'>
    <title>{% block title %}Mimicron{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', path='/css/main.css') }}">
    <script
      src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.10/dist/htmx.min.js"
      integrity="sha384-H5SrcfygHmAuTDZphMHqBJLc3FhssKjG7w/CeCpFReSfwBWDTKpkzPP8c+cLsK+V"
      crossorigin="anonymous"
      defer
    ></script>
    <script src="{{ url_for('static', path='/js/app.js') }}" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to content</a>
    <header class="site-header">
      <a class="brand" href="/ui" aria-label="Mimicron home">
        <span class="brand-mark" aria-hidden="true">M</span>
        <span>Mimicron</span>
      </a>
      <a class="quiet-link" href="/docs">API docs</a>
    </header>
    <div id="main-content">
      {% block content %}{% endblock %}
    </div>
  </body>
</html>
