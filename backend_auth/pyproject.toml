[project]
name = "auth-api"
version = "0.1.0"
description = "Auth API: JWT identity service"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14",
    "asyncpg>=0.30",
    "email-validator>=2.2",
    "fastapi>=0.115",
    "httpx>=0.28",
    "psycopg2-binary>=2.9.12",
    "pwdlib[argon2]>=0.3.0",
    "pydantic-settings>=2.7",
    "pyjwt[crypto]>=2.10",
    "python-multipart>=0.0.32",
    "redis>=5.2",
    "sqlalchemy[asyncio]>=2.0",
    "user-agents>=2.2",
    "uvicorn[standard]>=0.34",
]

[dependency-groups]
test = [
    "httpx>=0.28",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "asyncpg>=0.30",
    "pydantic-settings>=2.7",
    "sqlalchemy[asyncio]>=2.0",
    "pwdlib[argon2]>=0.3.0",
    "pyjwt[crypto]>=2.10",
    "redis>=5.2",
]
dev = [
    { include-group = "test" },
    "ruff>=0.9",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
